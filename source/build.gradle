plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
}

// Optional: -PvertexBuildDir=<path> puts build output outside the project. Useful when the project
// lives in a synced folder (OneDrive) that locks freshly written class files mid-build.
if (project.hasProperty("vertexBuildDir")) {
	layout.buildDirectory = file(project.property("vertexBuildDir"))
}

fabricApi {
	// Creates the `gametest` source set and the `runClientGameTest` task: launches a real
	// Minecraft client, runs every FabricClientGameTest in the vertex-gametest mod
	// (creating a world, pressing keys, taking screenshots), then exits.
	configureTests {
		createSourceSet = true
		modId = "vertex-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Plain JUnit for the Minecraft-free core (trace format, detector, explainer).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
